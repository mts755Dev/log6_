# Supabase Configuration
# This file is used by Supabase CLI

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Public installer signup — no user JWT exists yet.
[functions.create-installer-account]
verify_jwt = false

[functions.save-onboarding-document]
verify_jwt = true

[functions.cancel-installer-signup]
verify_jwt = true

[functions.uk-address-lookup]
verify_jwt = true

